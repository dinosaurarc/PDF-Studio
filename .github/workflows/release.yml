name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.4
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        default: false
        type: boolean
      windows_run_id:
        description: Optional Windows build workflow run id
        required: false
        type: string
      macos_run_id:
        description: Optional macOS build workflow run id
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        if: ${{ inputs.windows_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true

      - name: Download macOS artifacts
        if: ${{ inputs.macos_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.macos_run_id }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          mkdir -p release-assets
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No artifacts found. Run Windows/macOS build workflows first, then pass their run ids."
            exit 1
          fi
          VERSION="$(node -p "require('./desktop/electron/package.json').version")"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Input tag $RELEASE_TAG does not match package version v$VERSION."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${GITHUB_SHA}"
          fi
          args=()
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "PDF Studio ${VERSION}" \
              "${args[@]}"
          fi
