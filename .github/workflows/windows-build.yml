name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare application files
        run: |
          node work/build-standalone.js
          New-Item -ItemType Directory -Force desktop/electron/app | Out-Null
          Copy-Item outputs/pdf-page-studio/index.html desktop/electron/app/index.html -Force

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm install --no-audit --no-fund

      - name: Build Setup and Portable
        working-directory: desktop/electron
        run: npm run dist:win

      - name: Verify Windows files
        working-directory: desktop/electron
        run: |
          if (-not (Get-ChildItem dist -Filter "*-Setup.exe")) { throw "Setup.exe is missing." }
          if (-not (Get-ChildItem dist -Filter "*-Portable.exe")) { throw "Portable.exe is missing." }
          if (-not (Test-Path dist/latest.yml)) { throw "latest.yml is missing." }
          if (-not (Get-ChildItem dist -Filter "*.blockmap")) { throw "Windows blockmap is missing." }

      - name: Generate SHA-256 checksums
        working-directory: desktop/electron
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: |
            desktop/electron/dist/*-Setup.exe
            desktop/electron/dist/*-Portable.exe
            desktop/electron/dist/latest.yml
            desktop/electron/dist/*.blockmap
            desktop/electron/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
