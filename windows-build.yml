name: Build and publish desktop applications

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        run: |
          $version = (Get-Content desktop/electron/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - name: Prepare application files
        run: |
          node work/build-standalone.js
          New-Item -ItemType Directory -Force desktop/electron/app | Out-Null
          Copy-Item outputs/pdf-page-studio/index.html desktop/electron/app/index.html -Force

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm install --no-audit --no-fund

      - name: Build NSIS Setup and Portable EXE
        working-directory: desktop/electron
        run: npm run dist:win

      - name: Verify Windows update files
        working-directory: desktop/electron
        run: |
          if (-not (Get-ChildItem dist -Filter "*-Setup.exe")) { throw "Setup.exe is missing." }
          if (-not (Get-ChildItem dist -Filter "*-Portable.exe")) { throw "Portable.exe is missing." }
          if (-not (Test-Path dist/latest.yml)) { throw "latest.yml is missing." }
          if (-not (Get-ChildItem dist -Filter "*.blockmap")) { throw "Windows blockmap is missing." }

      - name: Generate SHA-256 checksums
        working-directory: desktop/electron
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii dist/SHA256SUMS-Windows.txt

      - name: Upload Windows build files
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Windows
          path: |
            desktop/electron/dist/*-Setup.exe
            desktop/electron/dist/*-Portable.exe
            desktop/electron/dist/latest.yml
            desktop/electron/dist/*.blockmap
            desktop/electron/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    env:
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version
        run: |
          VERSION="$(node -p "require('./desktop/electron/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION."
            exit 1
          fi

      - name: Check macOS signing configuration
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing="${missing} ${name}"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::warning::macOS signing secrets are incomplete:${missing}. An unsigned DMG/ZIP will still be built, but reliable macOS automatic updates require Apple Developer ID signing."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Prepare application files
        run: |
          node work/build-standalone.js
          mkdir -p desktop/electron/app
          cp outputs/pdf-page-studio/index.html desktop/electron/app/index.html

      - name: Install desktop dependencies
        working-directory: desktop/electron
        run: npm install --no-audit --no-fund

      - name: Build macOS DMG and updater ZIP
        working-directory: desktop/electron
        run: npm run dist:mac

      - name: Verify macOS update files
        working-directory: desktop/electron
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          test -f dist/latest-mac.yml
          test -n "$(find dist -maxdepth 1 -name '*.blockmap' -print -quit)"

      - name: Generate SHA-256 checksums
        working-directory: desktop/electron
        run: |
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) -print0 |
            sort -z |
            xargs -0 shasum -a 256 > dist/SHA256SUMS-macOS.txt

      - name: Upload macOS build files
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-macOS
          path: |
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.zip
            desktop/electron/dist/latest-mac.yml
            desktop/electron/dist/*.blockmap
            desktop/electron/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all desktop build files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create version tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./desktop/electron/package.json').version")"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              -f "ref=refs/tags/${TAG}" \
              -f "sha=${GITHUB_SHA}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "PDF大编辑 ${VERSION}"
          fi
